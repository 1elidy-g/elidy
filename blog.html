<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Yanjye</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        #posts article {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 20px auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.2);
        }
        .read-more-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .read-more-btn:hover {
            background: #e68900;
            transform: scale(1.1);
        }
        footer {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            margin-top: 20px;
        }
        .footer-icons {
            margin-top: 10px;
        }
        .footer-icons a {
            color: white;
            margin: 0 10px;
            font-size: 24px;
            text-decoration: none;
            transition: 0.3s;
        }
        .footer-icons a:hover {
            color: #ff9800;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ikaze kuri Blog Yanjye</h1>
        <nav>
            <ul>
                <li><a href="#">Ahabanza</a></li>
                <li><a href="#">Ibyerekeye</a></li>
                <li><a href="#">Twandikire</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="posts">
            <article>
                <h2>Inyandiko ya mbere</h2>
                <p>Iyi ni post ya mbere kuri blog yanjye...</p>
                <button class="read-more-btn">Soma byinshi</button>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Blog Yanjye - Byose ni ibyacu!</p>
        <div class="footer-icons">
            <a href="#" target="_blank">📘 Facebook</a>
            <a href="#" target="_blank">🐦 Twitter</a>
            <a href="#" target="_blank">📷 Instagram</a>
            <a href="#" target="_blank">▶️ YouTube</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
